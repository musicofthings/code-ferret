# Weekly automated model & API-docs check.
# Refreshes models.json against each provider's live model-listing API and
# watches provider API docs for changes. Any registry change is opened as a
# pull request for human review — that PR is the plugin's auto-update path.
#
# Provider keys are optional: providers without a configured secret are
# skipped (docs are still hashed, since docs need no key).
name: Model registry check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run registry unit tests
        run: python3 tests/test_check_models.py

      - name: Check models and API docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 scripts/check_models.py --report /tmp/model-check-report.md

      - name: Open update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: weekly model registry & API docs refresh"
          title: "chore: weekly model registry & API docs refresh"
          body-path: /tmp/model-check-report.md
          branch: chore/model-registry-update
          delete-branch: true
          add-paths: models.json
          labels: automated,model-registry
