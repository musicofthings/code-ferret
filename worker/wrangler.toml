name = "codeferret-proxy"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true

# Optional edge state. KV enables incremental review state, duplicate
# prevention, and walkthrough-comment updates; D1 enables suppression sync:
# [[kv_namespaces]]
# binding = "KV_SETTINGS"
# id = "<your-kv-namespace-id>"
#
# [[d1_databases]]
# binding = "D1_SUPPRESSIONS"
# database_name = "codeferret"
# database_id = "<your-d1-database-id>"
# # Schema: CREATE TABLE suppressions (repo TEXT NOT NULL, hash TEXT NOT NULL,
# #         reason TEXT, added_at TEXT, PRIMARY KEY (repo, hash));

# Model provider selection (optional). CodeFerret works with any supported
# frontier-model provider; see ../models.json for the registry. By default the
# first provider with a configured API key is used, in this order:
# anthropic -> openai -> google -> xai. Override with vars:
# [vars]
# CODEFERRET_PROVIDER = "anthropic"   # anthropic | openai | google | xai
# CODEFERRET_MODEL = "claude-sonnet-5"  # any model ID valid for that provider

# Secrets — never put values in this file. Set at least one provider key:
#   npx wrangler secret put ANTHROPIC_API_KEY   # Claude
#   npx wrangler secret put OPENAI_API_KEY      # GPT / Codex
#   npx wrangler secret put GEMINI_API_KEY      # Gemini (GOOGLE_API_KEY also accepted)
#   npx wrangler secret put XAI_API_KEY         # Grok
# Plus GitHub credentials:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put GITHUB_WEBHOOK_SECRET
